# Netlify — korisnička aplikacija za gledatelje (Expo web izvoz).
#
# Zašto ova mapa postoji umjesto da Netlify gradi izravno iz apps/mobile:
# `@zrinjski/core` i `@zrinjski/ui-tokens` označeni su kao "*", što se razrješava
# ISKLJUČIVO kroz npm workspaces iz korijena repozitorija. Kad bi Netlify za
# korijen projekta uzeo apps/mobile, instalacija bi pukla jer ta dva paketa ne
# postoje u registru — isti problem koji je oborio prvi build web admina.
#
# Ova mapa namjerno NEMA package.json: Netlify tada nema što sam instalirati,
# pa prepušta cijeli posao naredbi ispod, koja radi iz vrha repozitorija.
#
# U Netlify sučelju za ovaj projekt postavi:
#   Base directory   = deploy/spectator
#   (Build command i Publish directory dolaze odavde, ne diraj ih)
#
# Base directory MORA ići u sučelje, ne ovamo: Netlify korijenski netlify.toml
# čita prvi, pa bi `base` upisan ondje pregazio ovu postavku. Zato korijenski
# netlify.toml više nema `base` — vidi komentar u njemu.

[build]
  command = "cd ../.. && npm ci && npm run build:app && rm -rf deploy/spectator/dist && cp -r apps/mobile/dist deploy/spectator/dist"
  publish = "dist"

  # Ne troši objavu kad se aplikacija nije promijenila. Netlify naplaćuje 15
  # kredita po produkcijskoj objavi, a commit koji dira samo web admin ovdje
  # ne mijenja ništa. Izlazni kod 0 = preskoči.
  # Prazan $CACHED_COMMIT_REF (projekt bez ijedne objave) inače prevari
  # usporedbu i preskoči prvu objavu — vidi objašnjenje u korijenskom
  # netlify.toml.
  #
  # `:/` ispred svake putanje NIJE ukras. Netlify ignore naredbu pokreće u
  # base directoryju, dakle u deploy/spectator, a git putanje bez prefiksa
  # tumači u odnosu na trenutnu mapu — tražio je deploy/spectator/apps/mobile
  # i slično, ništa nije našao, zaključio "nema promjene" i preskočio objavu.
  # Izmjereno: iz deploy/spectator ista naredba vraća 0, s `:/` vraća 1.
  # `:/` znači "od korijena repozitorija, bez obzira gdje stojiš".
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- :/apps/mobile :/packages :/package.json :/package-lock.json :/deploy/spectator"

[build.environment]
  NODE_VERSION = "20"
