<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:radial-gradient(120% 80% at 50% 0%,#17181d 0%,#000 60%);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:28px 18px;}
    @keyframes barfill{from{width:0}}
    .ek-scroll::-webkit-scrollbar{display:none}
    a{text-decoration:none;color:inherit;}
  </style>
</helmet>

<div style="width:402px;background:#0B0B0E;color:#F4F4F5;border-radius:34px;overflow:hidden;border:1px solid #23242c;box-shadow:0 40px 120px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.02);position:relative;height:858px;display:flex;flex-direction:column;isolation:isolate;">

  <div aria-hidden="true" style="position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;">
    <div style="position:absolute;top:50%;left:50%;width:1300px;height:178px;transform:translate(-50%,-50%) rotate(-62deg);background:linear-gradient(90deg,transparent,rgba(156,12,24,.55) 38%,rgba(225,29,42,.62) 62%,transparent);opacity:.15;"></div>
    <div style="position:absolute;top:50%;left:50%;width:1300px;height:2px;transform:translate(-50%,-50%) rotate(-62deg);background:linear-gradient(90deg,transparent,rgba(225,29,42,.85) 50%,transparent);opacity:.22;"></div>
  </div>

  <!-- status bar -->
  <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 24px 4px;font-size:14px;font-weight:600;color:#F4F4F5;letter-spacing:.2px;flex:none;">
    <span>9:41</span>
    <span style="display:flex;gap:7px;align-items:center;color:#F4F4F5;">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"></rect><rect x="5" y="4.5" width="3" height="7.5" rx="1"></rect><rect x="10" y="2" width="3" height="10" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2A11 11 0 0 1 16 4.2"></path><path d="M3.5 6.8a7.2 7.2 0 0 1 10 0"></path><path d="M6 9.3a3.6 3.6 0 0 1 5 0"></path><circle cx="8.5" cy="11" r="0.6" fill="currentColor" stroke="none"></circle></svg>
      <span style="display:inline-flex;align-items:center;"><svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="currentColor" stroke-opacity=".4"></rect><rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor"></rect><rect x="24" y="4" width="2" height="5" rx="1" fill="currentColor" fill-opacity=".4"></rect></svg></span>
    </span>
  </div>

  <!-- top bar -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 18px 4px;flex:none;">
    <a href="Pocetna.dc.html" style="display:flex;align-items:center;gap:4px;color:#9AA0AA;font-size:14px;font-weight:500;cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>Natrag
    </a>
    <span style="display:flex;align-items:center;gap:5px;color:#FF5662;font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.5px;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.5 3-5.5a4 4 0 0 0-7-2.7A4 4 0 0 0 8 8.5c0 2 1.5 4 3 5.5l4 4z"></path></svg>Prati
    </span>
  </div>

  <!-- hero -->
  <div style="position:relative;overflow:hidden;padding:14px 22px 20px;background:linear-gradient(165deg,#23090c 0%,#15161B 60%,#121217 100%);border-bottom:1px solid #2A2B33;flex:none;">
    <div style="position:absolute;left:-15%;right:-15%;top:38%;height:74px;background:linear-gradient(90deg,#9C0C18,#E11D2A);transform:rotate(-9deg);opacity:.16;"></div>
    <div style="position:relative;display:flex;align-items:center;gap:15px;">
      <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="ekipa-zri-grb" placeholder="Grb / fotka" shape="rounded" radius="17" style="display:block;width:66px;height:66px;flex:none;" hint-size="66px,66px"></x-import>
      <div style="flex:1;">
        <h1 style="font-family:'Oswald';font-weight:700;font-size:24px;letter-spacing:.4px;margin:0;">VHMRK Zrinjski</h1>
        <div style="color:#9AA0AA;font-size:13px;margin-top:3px;">Grupa A · <span style="color:#D9B24A;font-weight:600;">1. mjesto</span></div>
      </div>
    </div>
    <div style="position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;">
      <sc-for list="{{ teamStats }}" as="s" hint-placeholder-count="4">
        <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 6px;text-align:center;">
          <b style="font-family:'Oswald';font-weight:700;font-size:22px;display:block;line-height:1;color:{{ s.color }};">{{ s.value }}</b>
          <span style="font-size:10px;color:#9AA0AA;letter-spacing:.4px;text-transform:uppercase;">{{ s.label }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- tabs -->
  <div style="display:flex;flex:none;border-bottom:1px solid #2A2B33;">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <div onClick="{{ t.onClick }}" style="flex:1;text-align:center;padding:13px 0;font-family:'Oswald';font-weight:600;font-size:14px;cursor:pointer;color:{{ t.color }};box-shadow:{{ t.underline }};transition:color .2s;">{{ t.label }}</div>
    </sc-for>
  </div>

  <div class="ek-scroll" style="flex:1;overflow-y:auto;padding:14px 18px 28px;scrollbar-width:none;">

    <!-- SASTAV -->
    <sc-if value="{{ isSquad }}" hint-placeholder-val="{{ true }}">
    <div style="background:#15161B;border:1px solid #2A2B33;border-radius:16px;overflow:hidden;box-shadow:0 6px 16px -10px rgba(0,0,0,.8);margin-bottom:14px;">
      <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="ekipa-zri-foto" placeholder="Dovuci zajedničku fotku ekipe" shape="rect" style="display:block;width:100%;height:180px;" hint-size="100%,180px"></x-import>
    </div>
    <sc-for list="{{ squad }}" as="p" hint-placeholder-count="8">
      <div style="display:flex;align-items:center;gap:13px;padding:11px 4px;border-bottom:1px solid #1d1e25;">
        <span style="font-family:'Oswald';font-weight:700;font-size:16px;color:#6B7079;width:26px;text-align:center;">{{ p.no }}</span>
        <div style="width:38px;height:38px;border-radius:11px;background:#1C1D24;border:1px solid #2A2B33;display:grid;place-items:center;font-family:'Oswald';font-weight:700;font-size:13px;color:#9AA0AA;flex:none;">{{ p.init }}</div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">{{ p.name }}</div>
          <div style="color:#9AA0AA;font-size:12px;margin-top:1px;">{{ p.pos }}</div>
        </div>
        <sc-if value="{{ p.goals }}" hint-placeholder-val="0"><span style="display:flex;align-items:center;gap:5px;font-family:'Oswald';font-weight:700;font-size:14px;color:#FF5662;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle></svg>{{ p.goals }}</span></sc-if>
      </div>
    </sc-for>
    </sc-if>

    <!-- UTAKMICE -->
    <sc-if value="{{ isMatches }}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{ matches }}" as="m" hint-placeholder-count="5">
      <a href="{{ m.href }}" style="display:flex;align-items:center;gap:11px;background:#15161B;border:1px solid {{ m.border }};border-radius:13px;padding:12px 14px;margin-bottom:10px;box-shadow:0 6px 16px -10px rgba(0,0,0,.8);cursor:pointer;transition:transform .12s;" style-active="transform:scale(.985)">
        <div style="display:flex;flex-direction:column;align-items:center;width:42px;flex:none;">
          <span style="font-family:'Oswald';font-weight:600;font-size:11px;color:#9AA0AA;">{{ m.date }}</span>
          <span style="font-family:'Oswald';font-weight:700;font-size:13px;color:{{ m.timeColor }};">{{ m.time }}</span>
        </div>
        <div style="width:1px;height:30px;background:#2A2B33;flex:none;"></div>
        <span style="flex:1;font-weight:600;font-size:13px;">{{ m.opp }}</span>
        <span style="{{ m.resultStyle }}">{{ m.result }}</span>
      </a>
    </sc-for>
    </sc-if>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:438,&quot;height&quot;:914}}">
class Component extends DCLogic {
  state = { tab: 'Sastav' };

  renderVals() {
    const tab = this.state.tab;
    const tabs = ['Sastav','Utakmice'].map(label => ({
      label,
      onClick: () => this.setState({ tab: label }),
      color: tab === label ? '#F4F4F5' : '#6B7079',
      underline: tab === label ? 'inset 0 -2px 0 #E11D2A' : 'none',
    }));

    const teamStats = [
      { label:'Odigrano', value:'5', color:'#F4F4F5' },
      { label:'Pob.', value:'5', color:'#22C55E' },
      { label:'Gol +/−', value:'+18', color:'#F4F4F5' },
      { label:'Bod.', value:'10', color:'#D9B24A' },
    ];

    const squad = [
      { no:1, name:'Davor Soldo', pos:'Vratar', init:'DS', goals:0 },
      { no:7, name:'Marko Jurić', pos:'Lijevo krilo', init:'MJ', goals:12 },
      { no:9, name:'Josip Marić', pos:'Kružni napadač', init:'JM', goals:31 },
      { no:11, name:'Luka Bevanda', pos:'Srednji vanjski', init:'LB', goals:8 },
      { no:14, name:'Ante Kožul', pos:'Desni vanjski', init:'AK', goals:19 },
      { no:17, name:'Ivan Pavlović', pos:'Lijevi vanjski', init:'IP', goals:6 },
      { no:21, name:'Mate Šarić', pos:'Desno krilo', init:'MŠ', goals:9 },
      { no:23, name:'Tomislav Bago', pos:'Kružni napadač', init:'TB', goals:14 },
    ];

    const G = 'font-family:Oswald;font-weight:700;font-size:14px;color:#22C55E;';
    const matches = [
      { date:'6.6.', time:'10:00', opp:'Široki', result:'34:18', href:'Uzivo.dc.html', resStyle:'win', border:'#2A2B33' },
      { date:'6.6.', time:'12:00', opp:'Čapljina', result:'28:21', href:'Uzivo.dc.html', resStyle:'win', border:'#2A2B33' },
      { date:'7.6.', time:'10:30', opp:'Posušje', result:'31:25', href:'Uzivo.dc.html', resStyle:'win', border:'#2A2B33' },
      { date:'7.6.', time:'17:00', opp:'Izviđač', result:'30:28', href:'Uzivo.dc.html', resStyle:'win', border:'#2A2B33' },
      { date:'8.6.', time:'19:00', opp:'Ljubuški', result:'UŽIVO', href:'Uzivo.dc.html', resStyle:'live', border:'rgba(217,178,74,.5)' },
    ].map(m => {
      const win = m.resStyle === 'win', live = m.resStyle === 'live';
      return { ...m,
        timeColor: live ? '#FF5662' : '#E11D2A',
        resultStyle: live
          ? 'font-family:Oswald;font-weight:700;font-size:11px;color:#fff;background:linear-gradient(150deg,#E11D2A,#9C0C18);padding:3px 9px;border-radius:7px;box-shadow:0 4px 12px -4px rgba(225,29,42,.7);'
          : 'font-family:Oswald;font-weight:700;font-size:15px;color:#22C55E;',
      };
    });

    return {
      tabs, teamStats, squad, matches,
      isSquad: tab === 'Sastav', isMatches: tab === 'Utakmice',
    };
  }
}
</script>
</body>
</html>
