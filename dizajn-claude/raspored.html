<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Raspored — VHMRK Zrinjski</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--red:#E11D2A;--gold:#D9B24A;--bg:#0B0B0E;--card:#15161B;--card2:#1C1D24;--line:#2A2B33;--txt:#F4F4F5;--sub:#9AA0AA;--mut:#6B7079;--head:'Oswald',sans-serif;--body:'Inter',sans-serif;}
  *{box-sizing:border-box}body{margin:0;background:#000;font-family:var(--body);display:flex;justify-content:center;padding:24px}
  .phone{width:390px;background:var(--bg);color:var(--txt);border-radius:28px;overflow:hidden;border:1px solid var(--line);min-height:780px;position:relative}
  .statusbar{display:flex;justify-content:space-between;padding:10px 18px;font-size:12px;color:var(--sub)}
  .content{padding:8px 16px 90px}
  h1{font-family:var(--head);font-weight:700;font-size:26px;margin:6px 4px 12px}
  .days{display:flex;gap:8px;margin-bottom:16px}
  .day{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--sub)}
  .day.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
  .day b{display:block;font-family:var(--head);font-size:15px;color:inherit}
  .tl{position:relative;padding-left:54px}
  .tl::before{content:"";position:absolute;left:38px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .ev{position:relative;margin-bottom:14px}
  .ev .tm{position:absolute;left:-54px;top:8px;width:42px;text-align:right;font-family:var(--head);font-weight:600;color:var(--sub);font-size:13px}
  .ev .dot{position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:999px;background:var(--mut);border:2px solid var(--bg)}
  .ev.live .dot{background:var(--red)}
  .ev.fin .dot{background:var(--gold)}
  .row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .row.final{border-color:var(--gold)}
  .crest{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--head);font-weight:700;color:#fff;font-size:11px;flex:none}
  .t{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t.r{text-align:right}
  .mid{min-width:52px;text-align:center}
  .b-live{background:var(--red);color:#fff;font-family:var(--head);font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700}
  .b-score{font-family:var(--head);font-weight:700;font-size:16px}
  .vs{color:var(--mut);font-size:12px}
  .b-final{display:inline-block;color:var(--gold);font-family:var(--head);font-size:11px;letter-spacing:1px;border:1px solid var(--gold);border-radius:6px;padding:2px 7px;margin-bottom:6px}
  .prog{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card2);border:1px dashed var(--line);border-radius:12px}
  .prog .btn{margin-left:auto;color:#2D6CDF;font-weight:600;font-size:12px;border:1px solid #2D6CDF;border-radius:6px;padding:4px 10px}
  .nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 0 14px}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:10px;font-family:var(--head)}
  .nav a.on{color:var(--red)}.nav .ic{width:22px;height:22px;border-radius:6px;background:currentColor;opacity:.9}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>▮▮▮ ▮</span></div>
  <div class="content">
    <h1>RASPORED</h1>
    <div class="days">
      <div class="day">Pet<b>6.6.</b></div>
      <div class="day on">Sub<b>7.6.</b></div>
      <div class="day">Ned<b>8.6.</b></div>
    </div>

    <div class="tl">
      <div class="ev fin"><span class="tm">17:00</span><span class="dot"></span>
        <div class="row"><span class="crest" style="background:#E11D2A">ZRI</span><span class="t">Zrinjski</span><span class="mid b-score">3:1</span><span class="t r">Čapljina</span><span class="crest" style="background:#0D9488">CAP</span></div>
      </div>
      <div class="ev fin"><span class="tm">17:30</span><span class="dot"></span>
        <div class="row"><span class="crest" style="background:#2D6CDF">LJU</span><span class="t">Ljubuški</span><span class="mid b-score">2:1</span><span class="t r">Posušje</span><span class="crest" style="background:#C2410C">POS</span></div>
      </div>
      <div class="ev"><span class="tm">18:15</span><span class="dot"></span>
        <div class="prog"><span style="font-weight:600">🍽️ Domjenak za ekipe</span><span class="btn">Karta</span></div>
      </div>
      <div class="ev live"><span class="tm">19:00</span><span class="dot"></span>
        <span class="b-final">FINALE</span>
        <div class="row final"><span class="crest" style="background:#E11D2A">ZRI</span><span class="t">Zrinjski</span><span class="mid"><span class="b-live">UŽIVO 4:2</span></span><span class="t r">Ljubuški</span><span class="crest" style="background:#6A1FB0">LJU</span></div>
      </div>
      <div class="ev"><span class="tm">20:30</span><span class="dot"></span>
        <div class="prog"><span style="font-weight:600">🏆 Završna večera i dodjela</span><span class="btn">Karta</span></div>
      </div>
    </div>
  </div>
  <div class="nav">
    <a><span class="ic"></span>Početna</a><a class="on"><span class="ic"></span>Raspored</a><a><span class="ic"></span>Poredak</a><a><span class="ic"></span>Statist.</a><a><span class="ic"></span>Galerija</a><a><span class="ic"></span>Info</a>
  </div>
</div>
</body>
</html>
