# Netlify — objava web admina (apps/web-admin) iz monorepa.
# Build se pokreće iz korijena jer web-admin ovisi o workspace paketima
# (@zrinjski/core, @zrinjski/ui-tokens) koji se moraju instalirati zajedno.
#
# Supabase ključevi se NE drže ovdje — postavljaju se u Netlify sučelju
# (Site settings → Environment variables): VITE_SUPABASE_URL i VITE_SUPABASE_ANON_KEY.

[build]
  # Korijen repozitorija, izričito. Bez ovoga Netlify sam pogodi da je projekt u
  # apps/mobile, pa instalira samo njegove pakete (web-admin ostane bez vite →
  # "Cannot find type definition file for 'vite/client'") i objavi krivu mapu.
  base = "."
  command = "npm run build -w @zrinjski/web-admin"
  publish = "apps/web-admin/dist"

  # Ne objavljuj kad se web admin nije promijenio.
  #
  # Netlify naplaćuje 15 kredita po PRODUKCIJSKOJ OBJAVI, a monorepo znači da
  # i commit koji dira samo apps/mobile inače pokrene objavu web admina — koja
  # ne mijenja baš ništa. Od zadnjih 12 commitova 4 su bila takva.
  #
  # Izlazni kod 0 = preskoči objavu. `git diff --quiet` vraća 0 kad razlike
  # NEMA, što je točno željeno ponašanje. Uspoređuje se zadnji objavljeni
  # commit s trenutnim, pa ispravno radi i kad se pushne više commitova odjednom.
  # Kod prve objave $CACHED_COMMIT_REF je prazan → naredba padne → build ide.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web-admin packages package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "20"
  # Mobilna app (Expo/React Native) nije potrebna za web build, ali je u istom
  # workspaceu. Ako instalacija bude presporo/pukne, ovdje se prelazi na:
  # NPM_FLAGS = "--workspace @zrinjski/web-admin --include-workspace-root"

# SPA routing — /prijava, /moja-ekipa i ostale rute moraju vraćati index.html,
# inače Netlify traži datoteku tog imena i vraća 404 kod osvježavanja stranice.
# (Isto radi i apps/web-admin/public/_redirects; ovdje je da bude na jednom mjestu.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
